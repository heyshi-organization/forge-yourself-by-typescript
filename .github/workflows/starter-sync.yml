name: Starter Sync

# reference/src を変更したときに、学習者用の starter/src が再生成されているかを確認する。
# (学習者が starter を編集した PR では動かないよう、reference 側の変更だけを対象にしている)
on:
  push:
    branches: [main]
    paths:
      - 'reference/src/**'
      - 'scripts/generate-starter.mjs'
  pull_request:
    paths:
      - 'reference/src/**'
      - 'scripts/generate-starter.mjs'

permissions: {}

jobs:
  starter-sync:
    name: starter/src が reference/src と同期していること
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run starter:check
